name: Build image

on:
  push:
    branches: [main]
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only /nix/store (built derivations) and the path-registration db need to survive
      # across runs -- the rest of /nix/var/nix is daemon runtime state (locks, per-process
      # temproots, the build-user pool), root/nixbld-owned and recreated fresh every run.
      # actions/cache resolves a bare, non-wildcarded path (like the old `/nix`) as a single
      # directory match instead of individual files, so `!exclude` lines never got a chance
      # to filter anything -- tar then auto-recursed into the whole tree and choked on those
      # unreadable files regardless. Listing `db/**` explicitly forces per-file matching so
      # the excludes actually apply, and the bare `db` line drops the directory-entry match
      # itself (otherwise tar would recurse into it again and hit the same excluded files).
      - name: Cache Nix store
        uses: actions/cache@v6
        with:
          path: |
            /nix/store
            /nix/var/nix/db/**
            !/nix/var/nix/db
            !/nix/var/nix/db/big-lock
            !/nix/var/nix/db/reserved
          key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships an /etc/containers/registries.conf (from Podman) in the old v1
      # format, which the skopeo build devenv/nix2container bundles refuses to parse at all --
      # it fails before ever getting to credentials. Remove it; skopeo falls back to defaults.
      - name: Remove incompatible registries.conf
        run: sudo rm -f /etc/containers/registries.conf

      # `devenv container copy` builds the image (via nix2container) and pushes it directly
      # with skopeo -- no local Docker daemon needed. Destination is
      # ghcr.io/emergentconnext/<containers.shell.name>:<containers.shell.version>.
      - name: Build and push image
        run: devenv container copy --registry docker://ghcr.io/emergentconnext/ shell
