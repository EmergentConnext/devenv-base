name: Build image

on:
  push:
    branches: [main]
    paths:
      - devenv.nix
      - devenv.yaml
      - devenv.lock
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Excludes are the nix-daemon's runtime state (locks, per-process temproots, the
      # build-user pool) -- root/nixbld-owned, unreadable by the runner user, and pointless
      # to cache anyway since the daemon recreates them fresh every run. Without these, tar
      # exits non-zero on the permission errors and actions/cache silently skips the save,
      # so every run was rebuilding the entire store from scratch.
      - name: Cache Nix store
        uses: actions/cache@v6
        with:
          path: |
            /nix
            !/nix/var/nix/gc.lock
            !/nix/var/nix/db/big-lock
            !/nix/var/nix/db/reserved
            !/nix/var/nix/temproots/**
            !/nix/var/nix/userpool/**
          key: nix-${{ runner.os }}-${{ hashFiles('devenv.nix', 'devenv.yaml', 'devenv.lock') }}

      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ubuntu-latest ships an /etc/containers/registries.conf (from Podman) in the old v1
      # format, which the skopeo build devenv/nix2container bundles refuses to parse at all --
      # it fails before ever getting to credentials. Remove it; skopeo falls back to defaults.
      - name: Remove incompatible registries.conf
        run: sudo rm -f /etc/containers/registries.conf

      # `devenv container copy` builds the image (via nix2container) and pushes it directly
      # with skopeo -- no local Docker daemon needed. Destination is
      # ghcr.io/emergentconnext/<containers.shell.name>:<containers.shell.version>.
      - name: Build and push image
        run: devenv container copy --registry docker://ghcr.io/emergentconnext/ shell
